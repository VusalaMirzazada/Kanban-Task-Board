<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanBan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header__brand">
    <span class="header__logo-mark">K</span>
    <h1 class="header__title">Kanban İdarəetmə</h1>
  </div>

  <div class="controls">
    <input 
      type="search" 
      class="search" 
      id="searchInput" 
      placeholder="Tapşırıq axınında axtar...">

    <select class="filter" id="priorityFilter">
      <option value="all">Bütün prioritetlər</option>
      <option value="low">Aşağı</option>
      <option value="medium">Orta</option>
      <option value="high">Yüksək</option>
    </select>

    <button class="add-btn" id="addTaskBtn">+ Yeni Tapşırıq</button>
  </div>

</header>

<main>
  <div class="board">
    <div class="board__column" data-status="todo">
      <div class="board__column-title">
        <h2>To Do</h2>
        <span class="board__count">0</span>
      </div>
      <div class="board__tasks"id="todoTasks"></div>
    </div>

    <div class="board__column" data-status="inprogress">
      <div class="board__column-title">
        <h2>In Progress</h2>
        <span class="board__count">0</span>
      </div>
      <div class="board__tasks"id="progressTasks"></div>
    </div>

    <div class="board__column" data-status="done">
      <div class="board__column-title">
        <h2>Done</h2>
        <span class="board__count">0</span>
      </div>
      <div class="board__tasks" id="doneTasks"></div>
    </div>

  </div>

</main>

<div class="modal-overlay" id="taskModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 class="modal__title" id="modalTitle">Yeni Tapşırıq</h2>

    <form class="modal__form" id="taskForm">
      <div class="modal__field">
        <label for="taskTitle">Başlıq <span class="modal__required">*</span></label>
        <input type="text" id="taskTitle" name="taskTitle" placeholder="Məs: API inteqrasiyası" required>
      </div>

      <div class="modal__field">
        <label for="taskDesc">Açıqlama</label>
        <textarea id="taskDesc" name="taskDesc" placeholder="Tapşırıq haqqında qısa qeyd..."></textarea>
      </div>

      <div class="modal__field">
        <label for="taskPriority">Prioritet dərəcəsi</label>
        <select id="taskPriority">
          <option value="low">Aşağı (Low)</option>
          <option value="medium">Orta (Medium)</option>
          <option value="high">Yüksək (High)</option>
        </select>
      </div>

      <div class="modal__field">
        <label for="taskDate">Tarix</label>
        <input type="date" id="taskDate" name="taskDate">
      </div>

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" id="cancelBtn">Ləğv et</button>
        <button type="submit" class="btn btn--primary">Yadda saxla</button>
      </div>
    
    </form>
  
</div>
</div>

<script src="script.js"></script>
</body>
</html>
